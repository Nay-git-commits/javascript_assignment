<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interactive Web Form Assignment</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      .error-text {
        color: red;
        font-size: 0.9rem;
        margin-top: 3px;
        display: none; /* Hidden by default */
      }

      /* Utility to place text beside label */
      .label-error {
        margin-left: 10px;
        font-weight: normal;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="mb-4">Interactive Web Form</h3>

          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="username" class="form-control" />
            <div id="username-error" class="error-text">
              this field must not be empty
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" />
            <div id="email-error" class="error-text">
              this field must not be empty
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" />
            <div id="password-error" class="error-text">
              this field must not be empty
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control" />
            <div id="confirmPassword-error" class="error-text"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Interesting Topics</label>
            <span id="topic-error" class="error-text label-error"
              >At least one topic must be selected</span
            >

            <div class="form-check">
              <input
                class="form-check-input topic"
                type="checkbox"
                id="topic1"
                value="HTML"
              />
              <label class="form-check-label" for="topic1">HTML</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input topic"
                type="checkbox"
                id="topic2"
                value="CSS"
              />
              <label class="form-check-label" for="topic2">CSS</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input topic"
                type="checkbox"
                id="topic3"
                value="JavaScript"
              />
              <label class="form-check-label" for="topic3">JavaScript</label>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Gender</label>
            <span id="gender-error" class="error-text label-error"
              >please choose your gender</span
            >

            <select id="gender" class="form-select">
              <option value="--">--</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <button id="submitBtn" class="btn btn-primary">Submit</button>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      $(document).ready(function () {
        $("#submitBtn").click(function () {
          let isValid = true;

          // --- 1. Reset all errors first ---
          $(".form-control").removeClass("border-danger"); // Remove red borders
          $(".error-text").hide(); // Hide all error messages

          // --- 2. Check Empty Fields (Username, Email, Password, Confirm Password) ---
          const textFields = [
            "username",
            "email",
            "password",
            "confirmPassword",
          ];

          textFields.forEach(function (fieldId) {
            const field = $("#" + fieldId);
            if (field.val().trim() === "") {
              field.addClass("border-danger");
              // Set standard empty message
              $("#" + fieldId + "-error")
                .text("this field must not be empty")
                .show();
              isValid = false;
            }
          });

          // --- 3. Check Interesting Topics (At least one checked) ---
          if ($(".topic:checked").length === 0) {
            $("#topic-error").show();
            isValid = false;
          }

          // --- 4. Check Gender (Must not be "--") ---
          if ($("#gender").val() === "--") {
            $("#gender-error").show();
            isValid = false;
          }

          // --- 5. Check Password Mismatch ---
          // Only run logic if confirm password is NOT empty (to avoid overwriting the "empty" error)
          // OR strictly follow prompt to overwrite it.
          // Below logic checks if Confirm Password has value but doesn't match Password.

          const passwordVal = $("#password").val();
          const confirmVal = $("#confirmPassword").val();

          if (confirmVal !== passwordVal) {
            // If they don't match, apply error styles
            $("#confirmPassword").addClass("border-danger");

            // Even if it was flagged as "empty" before, the mismatch requirement
            // implies we specifically tell them it mismatched on submit.
            $("#confirmPassword-error")
              .text("confirmed password mismatched the password")
              .show();

            isValid = false;
          }

          if (isValid) {
            alert("Form submitted successfully!");
            // Here you would typically submit the form
          }
        });
      });
    </script>
  </body>
</html>
